services:
  backend:
    build: ./backend
    env_file: ".env"
    environment:
      BACKEND_PORT: "8080"
    ports:
      - "${BACKEND_PORT:-28472}:8080"
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    develop:
      watch:
        - action: sync
          path: ./backend
          target: ./app
          ignore:
            - tmp/
            - bin/
            - '*.test'
            - '*.out'
            - go.mod
            - go.sum
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/go.sum
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    restart: always
    env_file: ".env"
    ports:
      - '${DEV_POSTGRES_PORT:-28473}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
  frontend:
    build: ./frontend
    env_file: ".env"
    environment:
      BACKEND_DOMAIN: "http://backend:8080"
    ports:
      - "${FRONTEND_PORT:-28471}:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: ./app
          ignore:
            - node_modules/
            - .svelte-kit/
            - .svelte-kit-check/
            - .svelte-kit-build/
            - build/
            - .output/
            - vite.config.js.timestamp-*
            - vite.config.ts.timestamp-*
            - package.json
            - package-lock.json
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

volumes:
  db-data:
  go-mod-cache:
  go-build-cache:
